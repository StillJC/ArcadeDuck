name: Feature request
description: Request a feature to be added or improved in ArcadeDuck
body:

- type: markdown
  attributes:
    value: |
      **Please read before creating a new feature request:**
      1. Make sure the feature has not already been requested by [searching open and closed issues](https://github.com/StillJC/ArcadeDuck/issues?q=is%3Aissue+sort%3Aupdated-desc+).
      2. Please open one issue per requested feature so each request can be tracked independently.
      3. Please submit feature requests in English so contributors can review them.
      4. For general setup questions or support, use the [ArcadeDuck Discord server](https://discord.gg/e3ADpmY54f).

- type: textarea
  attributes:
    label: Problem statement
    description: |
      What limitation or missing behavior are you trying to address?
  validations:
    required: true

- type: textarea
  attributes:
    label: Proposed solution
    description: |
      Describe the behavior or feature you would like ArcadeDuck to provide.
  validations:
    required: true

- type: textarea
  attributes:
    label: Arcade system or game
    description: |
      If this request is specific to an arcade platform or title, identify it here.

- type: textarea
  attributes:
    label: Alternatives considered
    description: |
      Describe any alternatives or workarounds you have considered.

- type: textarea
  attributes:
    label: Additional context
    description: |
      Add screenshots, references, hardware information, or other context that would help explain the request.
