name: Bug report
description: Report a bug in ArcadeDuck
body:

- type: markdown
  attributes:
    value: |
      **Welcome to the ArcadeDuck GitHub issue tracker.**

      Before creating a bug report:
      1. Make sure the issue has not already been reported by [searching open and closed issues](https://github.com/StillJC/ArcadeDuck/issues?q=is%3Aissue+sort%3Aupdated-desc+).
      2. Please reproduce the problem on the current ArcadeDuck release or a recent development build when possible.
      3. If the issue may be related to rendering or enhancements, retest once with enhancements disabled and Advanced Settings at their defaults.
      4. Disable cheats before testing.
      5. Verify the game's ROM/CHD and required BIOS files before reporting dump-related problems.
      6. Include an ArcadeDuck log when it contains useful information about the problem.
      7. Please submit bug reports in English so contributors can review them. For general setup or support questions, use the [ArcadeDuck Discord server](https://discord.gg/e3ADpmY54f).

- type: input
  attributes:
    label: Game and system
    description: |
      Specify the game name, ROM set/short name, arcade system, and region or revision if known.
    placeholder: Tekken 3 (tekken3), Namco System 12, World
  validations:
    required: true

- type: textarea
  attributes:
    label: Description of the issue
    description: |
      Describe what you are seeing and/or hearing. What does not work, and what did you expect to happen instead?
      You can drag and drop screenshots, videos, and log files into this field.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: |
      Provide the shortest reliable sequence of steps that reproduces the issue.
  validations:
    required: true

- type: input
  attributes:
    label: ArcadeDuck version
    description: |
      Enter the ArcadeDuck version, build number, and commit hash shown by the application when available.
    placeholder: 0.5.1-dev (Build D00xx, g012345678)
  validations:
    required: true

- type: input
  attributes:
    label: Software and hardware information
    description: |
      Specify your Windows version, CPU, GPU, and graphics driver version.
    placeholder: Windows 11, Ryzen 7 5800X3D, GeForce RTX 4070, driver 000.00
  validations:
    required: true

- type: dropdown
  attributes:
    label: Rendering backend
    description: |
      Select the rendering backend used when the problem occurred. If the problem reproduces with multiple backends, mention that in the description.
    options:
      - Auto
      - Software
      - Direct3D 11
      - Direct3D 12
      - OpenGL
      - Vulkan
  validations:
    required: true

- type: textarea
  attributes:
    label: Input and cabinet setup
    description: |
      If relevant, describe the input devices and backend in use, such as keyboard, XInput, DirectInput, Raw Input, light guns, trackball, or external-output hardware.

- type: textarea
  attributes:
    label: Logs and additional context
    description: |
      Attach the ArcadeDuck log after reproducing the problem and add any other details that may help diagnose it.
